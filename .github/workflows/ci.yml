name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check qevion tests scripts
      - name: Ruff format
        run: ruff format --check qevion tests scripts
      - name: Mypy strict
        run: mypy
      - name: Import contracts (QV-ACC-004)
        run: lint-imports
      - name: Schema drift (QV-EVT-005)
        run: python scripts/gen_schemas.py --check
      - name: Tests
        run: mkdir -p evidence/ci && pytest -q --junitxml=evidence/ci/junit.xml
      - name: Core domain-term gate (QV-ACC-005)
        run: bash scripts/recovery/verify.sh
      - name: License scan (QV-LIC)
        run: |
          pip-licenses --format=json > evidence/ci/licenses.json
          python scripts/license_gate.py evidence/ci/licenses.json docs/registry/licenses.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ci-evidence, path: evidence/ci/ }
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
